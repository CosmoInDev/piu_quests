# Cloudflare Pages 설정. 정적 빌드(out/) + Pages Functions(functions/) + D1.
name = "piu-quests"
compatibility_date = "2025-01-01"
pages_build_output_dir = "out"

# D1 데이터베이스 바인딩. database_id는 `wrangler d1 create piu-quests` 실행 후 채운다.
[[d1_databases]]
binding = "DB"
database_name = "piu-quests"
database_id = "61b5b7e4-bf24-4f7a-b3fa-4b6aa9303234"
