# main 브랜치에 push되면 Cloudflare Pages로 자동 빌드·배포한다.
# 필요한 GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN : Pages(및 D1) 편집 권한 토큰
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 계정 ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 대시보드/CLI에서 수동 실행도 허용

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js 정적 export)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/frontend
          # wrangler.toml의 D1 바인딩이 배포에 함께 적용된다.
          command: pages deploy out --project-name=piu-quests --branch=main
